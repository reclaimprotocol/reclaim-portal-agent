# Render Blueprint for the Genie backend.
# In Render: New → Blueprint → point at this repo. Then fill the secret
# values (marked sync:false) in the dashboard — they are NOT stored in git.
services:
  - type: web
    name: genie-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Pinned explicitly: the image's default CMD now serves the V3 service, so
    # this entry must name the V2 app or a Dockerfile change silently swaps
    # which application this URL is running.
    dockerCommand: sh -c "uvicorn genie.api.main:app --host 0.0.0.0 --port ${PORT:-8799}"
    healthCheckPath: /health
    # Free plan (no card required). NOTE: 512 MB RAM — browsing/search work,
    # but live discovery (Chromium) may OOM or time out. Bump to 'starter'
    # (paid) later for reliable discovery.
    plan: free
    autoDeploy: true
    branch: main
    envVars:
      - key: GENIE_DB_URL        # Neon connection string
        sync: false
      - key: GENIE_API_KEY       # shared secret (same value the frontend sends)
        sync: false
      - key: GENIE_CORS_ORIGINS  # https://<your-app>.vercel.app
        sync: false
      - key: OPENROUTER_API_KEY  # LLM for live discovery (the agent's real key)
        sync: false
      - key: ANTHROPIC_API_KEY   # optional Claude fallback (leave blank)
        sync: false
      - key: OPR_API_KEY         # optional — OpenPageRank metric
        sync: false
      - key: GEMINI_SEARCH_ENABLED  # Stage-A discovery: Gemini via OpenRouter
        value: "true"                # needs only OPENROUTER_API_KEY, no Google creds
      - key: VALIDATE_MAX_WORKERS   # low fan-out so free-tier DNS/sockets don't exhaust
        value: "3"
      - key: ENABLE_JS_RENDERING    # off on free tier — Chromium is too heavy for 512 MB
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"

  # --------------------------------------------------------------------- #
  #  Genie-V3 portal discovery — CSV in, CSV out. One service, one disk.   #
  #                                                                        #
  #  No database and no separate worker: runs are directories on the disk  #
  #  and the work happens in a background task inside this process. Two    #
  #  containers cannot share a local filesystem, so splitting them would   #
  #  buy nothing.                                                          #
  # --------------------------------------------------------------------- #
  - type: web
    name: genie-v3
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "uvicorn service.api:app --host 0.0.0.0 --port ${PORT:-8800}"
    healthCheckPath: /health
    # 2 GB minimum. find_portals renders every homepage in headless Chromium
    # and has NO internal browser semaphore — AGENT_CONCURRENCY is the only
    # bound. 512 MB OOMs on the first batch, and swap presents as network
    # timeouts, i.e. as live portals recorded dead.
    plan: standard
    numInstances: 1
    # OFF deliberately: with a persistent disk there is no zero-downtime
    # deploy, so a merge to main kills a running batch.
    autoDeploy: false
    branch: main
    disk:
      name: genie-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: AGENT_API_KEY         # shared secret; the dashboard BACKEND sends it
        sync: false
      - key: OPENROUTER_API_KEY    # required — the model cascade
        sync: false
      - key: SERPER_API_KEY        # required — rescue + capability expansion
        sync: false
      - key: AGENT_CONCURRENCY     # browsers in flight. Raise only with the memory graph open.
        value: "4"
      # Residential proxy. Without it a hosted run fetches every university from
      # this datacentre, which measurably changes what the crawl sees: buet.ac.bd
      # returned no portals from a US exit and the correct one through a BD exit.
      - key: USE_PROXY
        value: "1"
      # MUST match where this runs. Default `in` skips the proxy for Indian
      # domains on the assumption we are in India; from a US host that silently
      # fetches the largest slice of the org list from the wrong continent.
      - key: PROXY_HOME_CC
        value: us
      - key: RESIDENTIAL_PROXY_GATEWAY   # host:port, NO scheme
        sync: false
      - key: RESIDENTIAL_PROXY_USER
        sync: false
      - key: RESIDENTIAL_PROXY_PASS
        sync: false
      - key: AGENT_RUNS_DIR
        value: /data/runs
      # L5 memory on the disk — otherwise every deploy resets the resume shield
      # and discards co-learned legal keywords. Seed these from the git-tracked
      # copies on first boot; an empty tnc_memory.json throws away 166
      # vendor->legal mappings.
      - key: GENIE_TNC_MEMORY
        value: /data/tnc_memory.json
      - key: GENIE_DOMAIN_HISTORY
        value: /data/domain_history.json
      - key: GENIE_BLOCK_FILE
        value: /data/infrastructure_block.json
      - key: PYTHONUNBUFFERED
        value: "1"
