<!DOCTYPE html>
<!-- Minimal copy of https://new-portal4.hcmus.edu.vn/login.aspx (Vietnamese). Session tokens removed. -->
<html lang="vi">
<head><meta charset="utf-8"><title>HCMUS - Đăng nhập</title></head>
<body>
<form method="post" action="./login.aspx" id="aspnetForm">
  <h1>HCMUS Portal – Đăng nhập</h1>
  <p>Hãy dùng tài khoản của bạn để đăng nhập</p>
  <label>Tên đăng nhập</label>
  <input name="ctl00$ContentPlaceHolder1$txtUsername" type="text" id="ctl00_ContentPlaceHolder1_txtUsername">
  <span>Tên đăng nhập không được rỗng.</span>
  <label>Mật khẩu</label>
  <input name="ctl00$ContentPlaceHolder1$txtPassword" type="password" id="ctl00_ContentPlaceHolder1_txtPassword">
  <span>Mật khẩu không được rỗng.</span>
  <input id="login-check" type="checkbox"><label for="login-check">Lưu thông tin</label>
  <input type="submit" name="ctl00$ContentPlaceHolder1$btnLogin" value="Đăng nhập" id="ctl00_ContentPlaceHolder1_btnLogin">
  <a href="ForgotPassword.aspx">Quên mật khẩu?</a> <a href="Activate.aspx">Kích hoạt tài khoản?</a>
</form>

</body>
</html>
