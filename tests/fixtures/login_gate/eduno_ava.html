<!DOCTYPE html>
<!-- Minimal copy of https://ava07.eduno.com.br/login (Portuguese, Brazil). Tokens removed. -->
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Eduno</title></head>
<body>
<h1>Bem-vindo!</h1>
<p>Nosso ambiente virtual de aprendizado foi construído para sua comodidade e seu máximo proveito! Bons estudos!</p>
<form method="POST" action="https://ava07.eduno.com.br/login">
  <label for="empresa">INSTITUIÇÃO DE ENSINO</label>
  <input id="empresa" type="text" name="empresa">
  <label for="cpf">CPF ou E-MAIL</label>
  <input id="cpf" type="text" name="cpf">
  <label for="password">SENHA</label>
  <input id="password" type="password" name="password">
  <input type="checkbox" id="remember_me"> Memorizar minhas credenciais
  <a href="/password/reset">Esqueceu sua senha?</a>
  <button type="submit">ACESSAR</button>
</form>
<footer>EdunoEAD powered by hot systems</footer>
</body>
</html>
